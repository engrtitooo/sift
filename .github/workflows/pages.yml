# Publishes the repository root to GitHub Pages on every push to main.
#
# `configure-pages` runs with `enablement: true`, so this workflow turns Pages
# on by itself the first time it runs. That is the only reason it exists: the
# site is plain HTML and needs no build step, so there is nothing here that a
# "Deploy from a branch" setting would not also do.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-way: a partly-published site is worse than a
# slightly stale one, and these runs take seconds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
